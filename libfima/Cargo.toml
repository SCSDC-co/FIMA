[package]
name = "libfima"
version = "0.1.0"
edition = "2024"
description = "A library for creating Fast, Incredible, Minimal and Awesome file managers"
homepage = "https://github.com/SCSDC-co/FIMA"
repository = "https://github.com/SCSDC-co/FIMA"
license = "LGPL-3.0-only"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
glob = "0.3.4"
magic = "0.16.7"
shellexpand = "3.1.2"
time = { version = "0.3.55", features = ["formatting"] }
walkdir = "2.5.0"
zip = "9.0.5"

[target.'cfg(unix)'.dependencies]
file-owner = "0.1.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
] }
