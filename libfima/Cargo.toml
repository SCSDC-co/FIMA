[package]
name = "libfima"
version = "0.2.0"
edition = "2024"
description = "A library for creating Fast, Incredible, Minimal and Awesome file managers"
homepage = "https://github.com/SCSDC-co/FIMA"
repository = "https://github.com/SCSDC-co/FIMA"
license = "LGPL-3.0-only"
readme = "README.md"

[features]
path-extension = []
compressor-extension = []
archive-extension = []

extensions = ["path-extension", "compressor-extension", "archive-extension"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
bzip2 = "0.6.1"
flate2 = "1.1.10"
glob = "0.3.4"
magic = "0.17.0"
md5 = "0.8.1"
path-clean = "1.0.1"
sevenz-rust2 = "0.24.1"
sha2 = "0.11.1"
shellexpand = "3.1.2"
symlink = "0.1.0"
tar = "0.4.46"
time = { version = "0.3.55", features = ["formatting"] }
walkdir = "2.5.0"
xz = "0.1.0"
zip = "9.0.5"
zstd = "0.14.3"

[target.'cfg(unix)'.dependencies]
file-owner = "0.1.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
] }
