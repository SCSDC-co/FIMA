[package]
name = "libfima"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
glob = "0.3.4"
magic = "0.16.7"
time = { version = "0.3.55", features = ["formatting"] }

[target.'cfg(unix)'.dependencies]
file-owner = "0.1.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
] }
