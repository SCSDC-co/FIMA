name: build and test the program

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

env:
  CMAKE_GENERATOR: Ninja

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create theme file
        run: |
          mkdir -p ~/.config/fima
          cat > ~/.config/fima/theme.toml << 'EOF'
          [general]
          primary = "yellow"
          secondary = [252, 186, 3]
          border = "#fcba03"
          EOF

      - name: Setup C++
        uses: aminya/setup-cpp@v1
        with:
          ninja: true
          conan: true
          cmake: "3.31.0"
          gcc: "15"

      - name: Setup conan profile
        run: conan profile detect

      - name: Build the program
        run: ./scripts/build_tests.sh

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
